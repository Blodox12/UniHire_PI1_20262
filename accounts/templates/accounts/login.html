{% extends "core/base.html" %}
{% block title %}Login - UniHire{% endblock %}
{% block content %}
<div class="page-shell">
  <div class="container">
    <div class="card form-card">
      <h2>Login</h2>
      <div class="hero-actions" style="margin-bottom: 1rem;">
        <a href="{% url 'accounts:login' %}?role=student" class="btn {% if role == 'student' %}btn-primary{% else %}btn-secondary{% endif %}">Student</a>
        <a href="{% url 'accounts:login' %}?role=company" class="btn {% if role == 'company' %}btn-primary{% else %}btn-secondary{% endif %}">Company</a>
      </div>
      <form method="post">
        {% csrf_token %}
        <input type="hidden" name="role" value="{{ role }}" />
        <div class="form-group">
          <label>Email</label>
          <input type="email" name="email" required />
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" name="password" required />
        </div>
        <button class="btn btn-primary" type="submit">Login</button>
      </form>
      <p style="margin-top: 1rem;">
        No account yet? <a href="{% url 'accounts:register_student' %}">Register</a>
      </p>
    </div>
  </div>
</div>
{% endblock %}
